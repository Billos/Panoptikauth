services:
  panoptikauth:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dev"]
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: panoptikauth-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
